name: Automação Horária - Robô 3

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Fetch ML Products
        run: python scripts/fetch_ml_products.py

      - name: Generate Pages
        run: python scripts/generate_pages_enhanced.py

      - name: Apply Enhancements
        run: python scripts/apply_enhancements.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Update content [skip ci]" || echo "No changes to commit"
          git push
